<main class="mt-5 pt-3">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-lg-6 mb-3">
        <div class="card text-dark mb-3 h-100">
          <div class="card-header fw-bold text-light text-center fs-2">Login</div>
          <div class="card-body">
            <form (ngSubmit)="login()">
              <div class="mb-3">
                <label for="login" class="form-label">User ID (login)</label>
                <input class="form-control" id="login"
                       [(ngModel)]="loginObj.login" name="login" autocomplete="username">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       [(ngModel)]="loginObj.password" name="password" autocomplete="current-password">
              </div>

              <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

              <div class="form-group mt-4 text-center">
                <button type="submit" class="btn btn-info text-light login-btn">Login</button>
              </div>

              <div class="form-group mt-3 text-center">
                <p>Don't have an account?
                  <a routerLink="/register">Register</a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

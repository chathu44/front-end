<div class="page-shell">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
    <div>
      <h1 class="page-title">Qualifications</h1>
      <p class="page-subtitle mb-0">Manage teacher qualifications used in Teacher Registration.</p>
    </div>
    <button type="button" class="btn btn-accent add-btn" (click)="openAddModal()" title="Add qualification">
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>

  <div class="panel p-3">
    <div class="row g-3 align-items-end mb-3">
      <div class="col-md-5">
        <label class="form-label">Search</label>
        <div class="input-group">
          <input type="text" class="form-control" placeholder="Search by name or id"
                 [(ngModel)]="searchText" name="searchText">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Qualification Name</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of filteredQualifications">
            <td>{{ row.id }}</td>
            <td class="fw-semibold">{{ row.qualificationName }}</td>
            <td class="text-end">
              <button type="button" class="btn btn-outline-ink btn-sm me-1" title="Edit"
                      (click)="openEditModal(row)">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button type="button" class="btn btn-ghost-danger btn-sm" title="Delete"
                      (click)="deleteById(row.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="!filteredQualifications.length">
            <td colspan="3" class="text-center text-muted py-4">
              No qualifications yet. Click + to add one.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<ng-template #qualificationFormModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">{{ isEdit ? 'Update Qualification' : 'Add Qualification' }}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>

  <form (ngSubmit)="save()">
    <div class="modal-body">
      <div class="mb-1">
        <label class="form-label" for="qualificationName">Qualification Name <span class="text-danger">*</span></label>
        <input id="qualificationName" class="form-control" name="qualificationName"
               [(ngModel)]="qualificationObj.qualificationName"
               placeholder="e.g. Bachelor, Master, PhD" required>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-outline-ink" (click)="modal.dismiss()">Cancel</button>
      <button type="submit" class="btn btn-accent">
        {{ isEdit ? 'Update' : 'Submit' }}
      </button>
    </div>
  </form>
</ng-template>

<main class="mt-5 pt-3">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-lg-6 mb-3">
        <div class="card text-dark mb-3">
          <div class="card-header fw-bold text-light text-center fs-2">Register</div>
          <div class="card-body">
            <form (ngSubmit)="register()">
              <div class="mb-3">
                <label class="form-label">First Name</label>
                <input class="form-control" [(ngModel)]="registerObj.firstName" name="firstName">
              </div>
              <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input class="form-control" [(ngModel)]="registerObj.lastName" name="lastName">
              </div>
              <div class="mb-3">
                <label class="form-label">Login</label>
                <input class="form-control" [(ngModel)]="registerObj.login" name="login">
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" [(ngModel)]="registerObj.password" name="password">
              </div>

              <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
              <div class="alert alert-success" *ngIf="success">{{ success }}</div>

              <div class="text-center">
                <button type="submit" class="btn btn-info text-light">Sign Up</button>
              </div>
              <div class="text-center mt-3">
                <a routerLink="/login">Back to login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
